name: Hamlib for Windows on Arm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Hamlib branch, tag or commit to build (from HAMLIB_REPO)
        default: lld-add-stdcall-alias
      publish:
        description: Publish a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Our fork: upstream Hamlib-4.7 plus the lld --add-stdcall-alias configure
  # fix. Switch to Hamlib/Hamlib once that is upstream.
  HAMLIB_REPO: aj7kt/Hamlib
  HAMLIB_REF: ${{ inputs.ref || 'lld-add-stdcall-alias' }}

jobs:
  # Cross-compile on Linux: autotools/libtool run ~10x faster there than
  # under MSYS2 on Windows.
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      name: ${{ steps.pkg.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.HAMLIB_REPO }}
          ref: ${{ env.HAMLIB_REF }}
          path: hamlib
          fetch-depth: 0        # tags, for git describe

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            autoconf automake libtool pkg-config make texinfo zip zstd xz-utils

      - name: Set up llvm-mingw and the CLANGARM64 target libraries
        run: bash ci/setup-cross.sh "$RUNNER_TEMP/tools"

      - name: Build
        run: |
          source "$RUNNER_TEMP/tools/env.sh"
          bash ci/build.sh hamlib build install

      - name: Package
        id: pkg
        run: |
          source "$RUNNER_TEMP/tools/env.sh"
          export TARGET_PACKAGES_FILE="$RUNNER_TEMP/tools/target-packages.txt"
          name=$(bash ci/package.sh hamlib install dist | tail -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cat dist/*-BUILDINFO.txt dist/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/

  # Run the result on real Windows on Arm.
  test:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist

      - name: Unpack
        shell: pwsh
        run: Expand-Archive dist/${{ needs.build.outputs.name }}.zip -DestinationPath unpacked

      - name: Test
        shell: pwsh
        run: ./ci/test.ps1 -Bin unpacked/${{ needs.build.outputs.name }}/bin

  release:
    needs: [build, test]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist

      - name: Publish (once per Hamlib commit)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
            exit 0
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file dist/*-BUILDINFO.txt \
            dist/*.zip dist/*.dll dist/SHA256SUMS
