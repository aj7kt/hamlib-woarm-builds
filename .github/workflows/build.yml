name: Hamlib for Windows on Arm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Hamlib branch, tag or commit to build (from HAMLIB_REPO)
        default: lld-add-stdcall-alias

permissions:
  contents: read

env:
  # Our fork: upstream Hamlib-4.7 plus the lld --add-stdcall-alias configure
  # fix. Switch to Hamlib/Hamlib once that is upstream.
  HAMLIB_REPO: aj7kt/Hamlib
  HAMLIB_REF: ${{ inputs.ref || 'lld-add-stdcall-alias' }}

jobs:
  # Cross-compile on Linux: autotools/libtool run ~10x faster there than
  # under MSYS2 on Windows.
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      name: ${{ steps.pkg.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.HAMLIB_REPO }}
          ref: ${{ env.HAMLIB_REF }}
          path: hamlib
          fetch-depth: 0        # tags, for git describe

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            autoconf automake libtool pkg-config make texinfo zip zstd xz-utils

      - name: Set up llvm-mingw and the CLANGARM64 target libraries
        run: bash ci/setup-cross.sh "$RUNNER_TEMP/tools"

      - name: Build
        run: |
          source "$RUNNER_TEMP/tools/env.sh"
          bash ci/build.sh hamlib build install

      - name: Package
        id: pkg
        run: |
          source "$RUNNER_TEMP/tools/env.sh"
          export TARGET_PACKAGES_FILE="$RUNNER_TEMP/tools/target-packages.txt"
          name=$(bash ci/package.sh hamlib install dist | tail -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cat dist/*-BUILDINFO.txt dist/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/

  # Run the result on real Windows on Arm.
  test:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist

      - name: Unpack
        shell: pwsh
        run: Expand-Archive dist/${{ needs.build.outputs.name }}.zip -DestinationPath unpacked

      - name: Test
        shell: pwsh
        run: ./ci/test.ps1 -Bin unpacked/${{ needs.build.outputs.name }}/bin

  # A standing *draft* release per branch of this repo (placeholder tag
  # next-<branch>), updated in place by every successful push or manual
  # build: same draft, new files, target and notes. Drafts are visible only
  # to people with write access; nothing is public until you promote the
  # draft: edit it, set the tag to the package name given in its notes
  # (WS builds pin Hamlib by that tag) and publish. The next build then
  # starts a new standing draft. Pull requests do not touch the draft.
  draft:
    needs: [build, test]
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: standing-draft-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ needs.build.outputs.name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist

      - name: Update the standing draft release
        run: |
          set -euo pipefail
          R=$GITHUB_REPOSITORY
          tag="next-${GITHUB_REF_NAME//\//-}"
          title="Next Hamlib build: $NAME"
          published=$(TAG="$NAME" gh release list -R "$R" --limit 200 --json tagName,isDraft \
                        --jq '.[] | select(.tagName == env.TAG and (.isDraft | not)) | .tagName')
          {
            echo "**To release this build, set the tag to \`$NAME\` and publish.**"
            if [ -n "$published" ]; then
              echo
              echo "> Note: \`$NAME\` is already published; this draft rebuilds the same Hamlib commit."
            fi
            echo
            echo "Built by: $GITHUB_SERVER_URL/$R/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat dist/*-BUILDINFO.txt
            echo
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "_Standing draft, replaced by every build of $GITHUB_REF_NAME._"
          } > notes.md

          state=$(TAG="$tag" gh release list -R "$R" --limit 200 --json tagName,isDraft \
                    --jq '.[] | select(.tagName == env.TAG) | if .isDraft then "draft" else "published" end')
          case "$state" in
            published)
              echo "::error::$tag is a published release; refusing to overwrite it"; exit 1 ;;
            draft)
              echo "updating standing draft $tag"
              gh release edit "$tag" -R "$R" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
              gh release view "$tag" -R "$R" --json assets --jq '.assets[].name' |
                while read -r a; do gh release delete-asset "$tag" "$a" -R "$R" --yes; done
              gh release upload "$tag" -R "$R" dist/*.zip dist/*.dll dist/SHA256SUMS ;;
            *)
              echo "creating standing draft $tag"
              gh release create "$tag" -R "$R" --draft --target "$GITHUB_SHA" \
                --title "$title" --notes-file notes.md dist/*.zip dist/*.dll dist/SHA256SUMS ;;
          esac
